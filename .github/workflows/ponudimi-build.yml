name: PonudiMi build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify standalone API syntax
        run: node --check standalone/api/server.mjs
      - name: Run automated tests
        run: bun test tests
      - name: Report standalone API dependency vulnerabilities
        continue-on-error: true
        run: |
          cd standalone/api
          npm install --ignore-scripts --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/api-npm-audit.json" || true
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/api-npm-audit.json","utf8"));for(const [name,item] of Object.entries(r.vulnerabilities||{})){console.log(JSON.stringify({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via.map(v=>typeof v==="string"?v:{title:v.title,url:v.url,range:v.range})}));}'
      - name: Validate standalone Docker Compose configuration
        run: docker compose --env-file standalone/.env.example -f standalone/docker-compose.yml config --quiet
      - name: Build frontend
        run: npm run build
      - name: Assemble standalone ZIP package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/ponudimi-package"
          ZIP_FILE="$RUNNER_TEMP/PonudiMi-samostalna-instalacija.zip"
          mkdir -p "$PACKAGE_DIR"
          git archive --format=tar HEAD | tar -xf - -C "$PACKAGE_DIR"
          find "$PACKAGE_DIR" -type f -name "*.zip" -delete
          {
            echo "PonudiMi standalone package"
            echo "Commit: $GITHUB_SHA"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Build verification: successful"
          } > "$PACKAGE_DIR/BUILD-INFO.txt"
          (cd "$PACKAGE_DIR" && zip -qr "$ZIP_FILE" .)
      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PonudiMi-samostalna-instalacija
          path: ${{ runner.temp }}/PonudiMi-samostalna-instalacija.zip
          if-no-files-found: error
          retention-days: 30
