name: PonudiMi build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify standalone API syntax
        run: node --check standalone/api/server.mjs
      - name: Run automated tests
        run: bun test tests
      - name: Report frontend dependency vulnerabilities
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/frontend-npm-audit.json" || true
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/frontend-npm-audit.json","utf8"));for(const [name,item] of Object.entries(r.vulnerabilities||{})){console.log(JSON.stringify({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via.map(v=>typeof v==="string"?v:{title:v.title,url:v.url,range:v.range})}));}if(Object.values(r.vulnerabilities||{}).some(v=>["high","critical"].includes(v.severity)))process.exit(1);'
      - name: Report standalone API dependency vulnerabilities
        run: |
          cd standalone/api
          npm install --ignore-scripts --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/api-npm-audit.json" || true
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/api-npm-audit.json","utf8"));for(const [name,item] of Object.entries(r.vulnerabilities||{})){console.log(JSON.stringify({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via.map(v=>typeof v==="string"?v:{title:v.title,url:v.url,range:v.range})}));}if(Object.values(r.vulnerabilities||{}).some(v=>["high","critical"].includes(v.severity)))process.exit(1);'
      - name: Validate standalone Docker Compose configuration
        run: docker compose --env-file standalone/.env.example -f standalone/docker-compose.yml config --quiet
      - name: Validate Caddy reverse proxy configuration
        run: docker run --rm -e DOMAIN=:80 -v "$PWD/standalone/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Smoke test standalone Docker stack
        run: |
          set -euo pipefail
          COMPOSE=(docker compose --env-file standalone/.env.example -f standalone/docker-compose.yml)
          "${COMPOSE[@]}" up -d --build
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost/api/health -o "$RUNNER_TEMP/ponudimi-health.json"; then break; fi
            sleep 2
          done
          grep -q '"storage_backend":"postgres"' "$RUNNER_TEMP/ponudimi-health.json"
          curl -fsS -X POST http://localhost/api/db/query -H 'Content-Type: application/json' -d '{"table":"ponude","action":"select","limit":5}' -o "$RUNNER_TEMP/ponudimi-preview.json"
          grep -q '"data":\[\]' "$RUNNER_TEMP/ponudimi-preview.json"
          search_status=$(curl -sS -o "$RUNNER_TEMP/ponudimi-search.json" -w '%{http_code}' -X POST http://localhost/api/db/rpc -H 'Content-Type: application/json' -d '{"fn":"pretrazi_ponude","args":{}}')
          test "$search_status" = "401"
          offers_status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost/api/ponude)
          test "$offers_status" = "401"
          curl -fsS http://localhost/ -o /dev/null
          "${COMPOSE[@]}" ps
      - name: Print standalone Docker logs on failure
        if: failure()
        run: docker compose --env-file standalone/.env.example -f standalone/docker-compose.yml logs --no-color
      - name: Stop standalone Docker stack
        if: always()
        run: docker compose --env-file standalone/.env.example -f standalone/docker-compose.yml down -v --remove-orphans
      - name: Build frontend
        run: npm run build
      - name: Assemble standalone ZIP package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/ponudimi-package"
          ZIP_FILE="$RUNNER_TEMP/PonudiMi-samostalna-instalacija.zip"
          mkdir -p "$PACKAGE_DIR"
          git archive --format=tar HEAD | tar -xf - -C "$PACKAGE_DIR"
          find "$PACKAGE_DIR" -type f -name "*.zip" -delete
          {
            echo "PonudiMi standalone package"
            echo "Commit: $GITHUB_SHA"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Build verification: successful"
          } > "$PACKAGE_DIR/BUILD-INFO.txt"
          (cd "$PACKAGE_DIR" && zip -qr "$ZIP_FILE" .)
      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PonudiMi-samostalna-instalacija
          path: ${{ runner.temp }}/PonudiMi-samostalna-instalacija.zip
          if-no-files-found: error
          retention-days: 30
